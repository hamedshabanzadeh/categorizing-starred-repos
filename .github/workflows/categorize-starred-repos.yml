name: Categorize Starred Repos

on:
  schedule:
    # هر روز ساعت 12:00 شب (UTC) اجرا شه
    - cron: '0 12 * * *'
  workflow_dispatch:  # برای تست دستی

jobs:
  categorize:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml
      
      - name: Fetch and categorize starred repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python scripts/categorize.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update categorized repos - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

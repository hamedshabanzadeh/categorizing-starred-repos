name: Fetch New Starred Repos

on:
  schedule:
    # هر روز ساعت 00:00 UTC اجرا شود
    - cron: '0 0 * * *'
  workflow_dispatch:  # برای تست دستی

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch new starred repos into inbox
        env:
          GITHUB_TOKEN: ${{ secrets.STARRED_REPOS_TOKEN }}
        run: python scripts/categorize.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add new starred repos to inbox - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
